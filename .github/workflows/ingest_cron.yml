name: Automated Job Ingestion Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual triggering from GitHub UI
  push:
    paths:
      - 'services/pipeline/**'
      - '.github/workflows/ingest_cron.yml'

jobs:
  ingest:
    name: Ingest Live Job Listings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'services/pipeline/requirements.txt'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/pipeline/requirements.txt

      - name: Execute Multi-Provider Job Ingestion Engine
        run: |
          python services/pipeline/pipeline_runner.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCRAPINGDOG_KEY: ${{ secrets.SCRAPINGDOG_KEY }}
